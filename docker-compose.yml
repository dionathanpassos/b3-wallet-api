name: b3-wallet-api
services:
  template_api:
    image: mysql:8.4
    container_name: b3_wallet
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: db_b3_wallet_api
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3309:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
